<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mejorador de Prompts</title>
<style>
  :root{
    --bg1:#0b0a1a; --bg2:#1a1038; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
    --text:#eceaf7; --muted:#9a96b8; --a:#8b5cf6; --b:#22d3ee; --ok:#34d399; --err:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
    background:radial-gradient(900px 500px at 10% -10%,rgba(139,92,246,.35),transparent 60%),
               radial-gradient(800px 500px at 100% 10%,rgba(34,211,238,.22),transparent 60%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed; padding:20px 16px 48px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{text-align:center;padding:24px 0 20px}
  .logo{font-size:40px;filter:drop-shadow(0 0 18px rgba(139,92,246,.7))}
  h1{font-size:clamp(26px,6vw,38px);margin-top:6px;letter-spacing:-.5px;
     background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);margin-top:8px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35);margin-bottom:18px}
  label.t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;
          text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
  textarea{width:100%;min-height:150px;resize:vertical;background:rgba(0,0,0,.28);border:1px solid var(--border);
           border-radius:14px;color:var(--text);font:inherit;font-size:16px;line-height:1.55;padding:14px;outline:none;
           transition:border-color .2s, box-shadow .2s}
  textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
  textarea::placeholder{color:#6f6b8e}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);padding:8px 14px;border-radius:999px;
        font-size:14px;cursor:pointer;transition:.15s;user-select:none}
  .chip.on{background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(34,211,238,.25));color:#fff;border-color:rgba(139,92,246,.7)}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:none;border-radius:14px;transition:transform .1s, opacity .2s, box-shadow .2s}
  button:active{transform:scale(.97)}
  .go{background:linear-gradient(90deg,var(--a),#6366f1 55%,var(--b));color:#fff;font-weight:700;font-size:16px;padding:14px 26px;
      box-shadow:0 8px 28px rgba(99,102,241,.45);width:100%;margin-top:16px}
  .go:disabled{opacity:.6;cursor:wait}
  .ghost{background:rgba(255,255,255,.08);color:var(--text);padding:9px 14px;font-size:14px;border:1px solid var(--border)}
  .ghost:hover{background:rgba(255,255,255,.14)}
  #out{white-space:pre-wrap;word-wrap:break-word;line-height:1.65;font-size:15.5px;min-height:60px}
  .empty{color:#6f6b8e;font-style:italic}
  .err{color:var(--err)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
        animation:s .7s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .count{font-weight:400;text-transform:none;letter-spacing:0}
  details{margin-top:14px;color:var(--muted);font-size:14px}
  summary{cursor:pointer}
  .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  select,input[type=text]{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px}
  input[type=text]{flex:1;min-width:180px}
  footer{text-align:center;color:#6f6b8e;font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✨</div>
    <h1>Mejorador de Prompts</h1>
    <p>Escribe tu idea tal cual y recibe un prompt claro, preciso y listo para usar.</p>
  </header>

  <section class="card">
    <label class="t" for="inp"><span>Tu prompt</span><span class="count" id="cnt">0 caracteres</span></label>
    <textarea id="inp" placeholder="Ej: hazme un script que descargue imágenes de una página..."></textarea>

    <div class="row">
      <div class="chips" id="chips">
        <span class="chip on" data-m="general">General</span>
        <span class="chip" data-m="codigo">Código</span>
        <span class="chip" data-m="imagen">Imagen / Arte</span>
        <span class="chip" data-m="escritura">Escritura</span>
        <span class="chip" data-m="breve">Breve</span>
      </div>
    </div>

    <details>
      <summary>Ajustes avanzados</summary>
      <div class="opts">
        <select id="model">
          <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
          <option value="openai/gpt-oss-120b">openai/gpt-oss-120b</option>
          <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
        </select>
        <input type="text" id="custom" placeholder="O escribe otro modelo de Groq...">
      </div>
    </details>

    <button class="go" id="go">✨ Mejorar prompt</button>
  </section>

  <section class="card">
    <label class="t"><span>Prompt mejorado</span>
      <span style="display:flex;gap:8px">
        <button class="ghost" id="copy">📋 Copiar</button>
        <button class="ghost" id="reuse" title="Usar como entrada para mejorar de nuevo">🔁</button>
      </span>
    </label>
    <div id="out"><span class="empty">Aquí aparecerá el resultado…</span></div>
  </section>

  <footer>Hecho con Groq · uso personal</footer>
</div>

<script>
const API_KEY = "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";
const URL_API = "https://api.groq.com/openai/v1/chat/completions";

const MODES = {
  general:  "El prompt es de uso general. Hazlo claro, específico y bien estructurado.",
  codigo:   "El prompt es para programación. Especifica lenguaje, entorno, entradas/salidas, restricciones, manejo de errores y formato esperado de la respuesta.",
  imagen:   "El prompt es para generar imágenes con IA. Describe sujeto, estilo, composición, iluminación, paleta de colores, lente/ángulo, ambiente y calidad. Escríbelo como una descripción visual rica, en un solo bloque.",
  escritura:"El prompt es para escritura creativa o redacción. Define rol, tono, público, extensión, estructura y estilo.",
  breve:    "Mejora el prompt pero manteniéndolo breve y directo (máximo 3-4 líneas), sin perder precisión."
};

const SYSTEM = `Eres un experto en ingeniería de prompts. Recibirás un prompt escrito por un usuario y debes reescribirlo para que sea mucho mejor: más claro, específico, con contexto, rol cuando ayude, formato de salida y restricciones relevantes.

Reglas:
- Conserva la intención original; no inventes requisitos que contradigan lo que pidió.
- Responde en el MISMO idioma del prompt original.
- Devuelve ÚNICAMENTE el prompt mejorado, sin explicaciones, sin comillas envolventes, sin encabezados como "Prompt mejorado:".
- Si faltan datos importantes, usa marcadores entre [corchetes] para que el usuario los complete.`;

let mode = "general";
const $ = id => document.getElementById(id);
const inp = $("inp"), out = $("out"), go = $("go");

inp.addEventListener("input", () => $("cnt").textContent = inp.value.length + " caracteres");

$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); mode = c.dataset.m;
});

go.addEventListener("click", async () => {
  const text = inp.value.trim();
  if(!text){ out.innerHTML = '<span class="err">Escribe primero un prompt.</span>'; return; }
  const model = $("custom").value.trim() || $("model").value;
  go.disabled = true;
  go.innerHTML = '<span class="spin"></span>Mejorando…';
  out.innerHTML = '<span class="empty">Pensando…</span>';
  try{
    const res = await fetch(URL_API, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + API_KEY },
      body: JSON.stringify({
        model,
        temperature: 0.6,
        messages:[
          { role:"system", content: SYSTEM + "\n\nContexto adicional: " + MODES[mode] },
          { role:"user", content: "Prompt original:\n\n" + text }
        ]
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data?.error?.message || ("Error " + res.status));
    const result = (data.choices?.[0]?.message?.content || "").trim();
    if(!result) throw new Error("La respuesta llegó vacía.");
    out.textContent = result;
  }catch(err){
    out.innerHTML = '<span class="err"></span>';
    out.firstChild.textContent = "⚠️ " + err.message;
  }finally{
    go.disabled = false; go.innerHTML = "✨ Mejorar prompt";
  }
});

$("copy").addEventListener("click", async () => {
  const t = out.textContent;
  if(!t || out.querySelector(".empty") || out.querySelector(".err")) return;
  try{ await navigator.clipboard.writeText(t); }
  catch{ const r=document.createRange(); r.selectNodeContents(out); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); }
  const b = $("copy"); const o = b.textContent; b.textContent = "✅ Copiado"; setTimeout(()=>b.textContent=o, 1500);
});

$("reuse").addEventListener("click", () => {
  if(out.querySelector(".empty") || out.querySelector(".err")) return;
  inp.value = out.textContent; inp.dispatchEvent(new Event("input")); inp.focus();
});
</script>
</body>
</html>
